name: Android store build
# Run by hand (Actions > Android store build > Run workflow). Builds the Play Store bundle (.aab)
# signed with the upload key kept in the repo's secrets:
#   ANDROID_UPLOAD_KEYSTORE_BASE64  the upload-keystore.jks file, base64-encoded
#   ANDROID_UPLOAD_STORE_PASSWORD   its password (the key password is the same)
on: workflow_dispatch
jobs:
  aab:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: npm ci
      - run: python3 ../website/tools/fetch_shelters.py ../website/data/shelters.json || true
      - run: npm run build && npx cap sync android
      - name: Write the upload key
        env: { KEYSTORE_B64: "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" }
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the ANDROID_UPLOAD_KEYSTORE_BASE64 secret first"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
      - name: Build the signed bundle
        env:
          SAS_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          SAS_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          SAS_UPLOAD_KEY_ALIAS: upload
        run: cd android && ./gradlew bundleRelease
      - run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
        if: always()
      - uses: actions/upload-artifact@v6
        with:
          name: shelter-finder-release-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
