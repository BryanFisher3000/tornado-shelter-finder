# One-off check, not part of the app: looks for the Simulator window app on GitHub's Xcode 27 Mac
# (it was not where it used to be, so the iPhone Duo could not be unfolded from a script). About a
# minute. Runs only on pushes to the tmp-ios-maps-probe branch (a throwaway branch, never merged).
name: One-off check - where the Simulator app is
on:
  push:
    branches: [tmp-ios-maps-probe]
jobs:
  look:
    runs-on: xcode-27
    timeout-minutes: 6
    steps:
      - name: Look for the Simulator app
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|candidate' | sort -V | tail -1)
          echo "Xcode: $X"; ls -la /Applications | grep -i xcode || true
          D="$X/Contents/Developer"
          echo "--- $D/Applications"; ls -la "$D/Applications" 2>&1 | head -30
          echo "--- $X/Contents/Applications"; ls -la "$X/Contents/Applications" 2>&1 | head -30
          echo "--- apps inside Xcode (not the platforms)"
          find "$X" -maxdepth 8 -name "*.app" -not -path "*/Platforms/*" 2>/dev/null | head -80 > apps.txt || true
          while IFS= read -r a; do printf "%s  [%s]\n" "$a" "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$a/Contents/Info.plist" 2>/dev/null || echo '?')"; done < apps.txt
          echo "--- apps named like a simulator, anywhere usual"
          find /Applications /Library/Developer /System/Applications /System/Library/CoreServices "$HOME/Library/Developer" -maxdepth 9 -iname "*simulat*.app" 2>/dev/null | sort -u | head -40 || true
          echo "--- Spotlight"; mdfind "kMDItemCFBundleIdentifier == 'com.apple.iphonesimulator'" 2>/dev/null | head -5 || true
          mdfind -name Simulator.app 2>/dev/null | head -10 || true
          echo "--- words about folding in the simulator's own code"
          for f in "$D/Library/PrivateFrameworks/SimulatorKit.framework/Versions/A/SimulatorKit" "$D/Library/PrivateFrameworks/SimulatorKit.framework/SimulatorKit" /Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/CoreSimulator; do
            if [ -f "$f" ]; then echo "## $f"; strings -a "$f" | grep -i -E "unfold|folded|foldable|folding|foldstate|fold_|postur|hinge|clamshell" | sort -u | head -80 || true; fi
          done
          echo "--- frameworks with Simul in the name"; ls "$D/Library/PrivateFrameworks" 2>/dev/null | grep -i -E "simul|device" | head -30 || true
          echo "--- simctl"; xcrun simctl help 2>&1 | grep -i -E "fold|postur|hinge|pose" | head -20 || echo "(no such simctl commands)"
