# One-off check, not part of the app: asks an iPhone simulator what happens when an app opens a
# maps:// link. Runs only on pushes to the tmp-ios-maps-probe branch, which is deleted afterwards.
name: One-off check - iPhone map links
on:
  push:
    branches: [tmp-ios-maps-probe]
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Pick newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|candidate' | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Build the probe app
        working-directory: probe
        run: |
          mkdir -p Probe.app
          xcrun -sdk iphonesimulator swiftc -parse-as-library -target arm64-apple-ios17.0-simulator Probe.swift -o Probe.app/Probe
          cp Info.plist Probe.app/Info.plist
          codesign --force -s - Probe.app
          ls -la Probe.app
      - name: Boot an iPhone simulator
        run: |
          xcrun simctl list devices available | grep -E "^--|iPhone" | head -30
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = None
          for rt, devs in json.load(sys.stdin)["devices"].items():
              if "iOS" not in rt: continue
              key = [int(n) for n in rt.split("iOS-")[-1].split("-") if n.isdigit()]
              for d in devs:
                  if d["name"] == "iPhone 17" and (best is None or key > best[0]): best = (key, d["udid"])
          print(best[1])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Probe
        run: |
          BID=com.surviveastorm.mapprobe
          xcrun simctl install booted probe/Probe.app
          shot() {
            sleep 3
            xcrun simctl io booted screenshot "$1.png" >/dev/null 2>&1 || { echo "no screenshot $1"; return 0; }
            sips -s format jpeg -s formatOptions 45 -Z 640 "$1.png" --out "$1.jpg" >/dev/null 2>&1 || { echo "no jpeg $1"; return 0; }
            echo "===SHOT $1==="; base64 -b 76 -i "$1.jpg"; echo "===END $1==="
          }
          run() {
            xcrun simctl terminate booted $BID 2>/dev/null || true
            xcrun simctl launch booted $BID "$@" || echo "launch failed"
            sleep 10
            DATA=$(xcrun simctl get_app_container booted $BID data)
            echo "--- results so far"; cat "$DATA/Documents/result.txt" || echo "(no result file)"
          }
          D="36.168918,-95.755147"
          run "maps://?daddr=$D&dirflg=d"; shot one
          run "comgooglemaps://?daddr=$D&directionsmode=driving" "UL:https://maps.apple.com/?daddr=$D&dirflg=d"; shot two
          run "https://maps.apple.com/?daddr=$D&dirflg=d"; shot three
          echo "--- try removing Maps from the simulator"
          xcrun simctl uninstall booted com.apple.Maps && echo "uninstall: ok" || echo "uninstall: refused"
          sleep 3
          run "maps://?daddr=$D&dirflg=d"; shot four
          run "UL:https://maps.apple.com/?daddr=$D&dirflg=d"; shot five
