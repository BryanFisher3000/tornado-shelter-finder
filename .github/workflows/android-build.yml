name: Android test build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with:
          # the action's default list includes the retired 'tools' package, which sdkmanager no longer finds
          packages: platform-tools
      - run: npm ci
      # bundle the latest shelter list from Supabase; if that fails, the committed copy is used
      - run: python3 ../website/tools/fetch_shelters.py ../website/data/shelters.json || true
      - run: npm run build && npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: shelter-finder-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
