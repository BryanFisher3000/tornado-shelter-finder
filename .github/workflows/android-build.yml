name: Android test build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with:
          # the action's default list includes the retired 'tools' package, which sdkmanager no longer finds
          packages: platform-tools
      - run: npm ci
      - run: npm run build && npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shelter-finder-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
