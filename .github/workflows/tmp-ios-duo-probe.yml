# One-off check, not part of the app: asks Apple's iPhone Duo simulator how its screens are laid
# out. Runs only on pushes to the tmp-ios-maps-probe branch (a throwaway branch, never merged).
name: One-off check - iPhone Duo screens
on:
  push:
    branches: [tmp-ios-maps-probe]
jobs:
  explore:
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - name: Pick newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|candidate' | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Simulator commands
        run: |
          xcrun simctl help 2>&1 || true
          echo "=== devicetypes"; xcrun simctl list devicetypes | grep -i -E "duo|fold" || true
          echo "=== devices"; xcrun simctl list devices available | grep -i -E "^--|duo" || true
          for c in ui io status_bar boot spawn; do echo "=== help $c"; xcrun simctl help $c 2>&1 | head -70 || true; done
          echo "=== words"; xcrun simctl help 2>&1 | grep -i -E "fold|pose|posture|hinge|display|rotat|orient|hub" || true
          echo "=== devicectl / hub tools"; ls "$(xcode-select -p)/usr/bin" | grep -i -E "hub|devicectl|simctl|sim" || true
          xcrun --find devicehub 2>&1 | head -2 || true
      - name: Duo device type
        run: |
          xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          for t in json.load(sys.stdin)["devicetypes"]:
              if "duo" in t["name"].lower(): print(json.dumps(t, indent=1))'
          P=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          for t in json.load(sys.stdin)["devicetypes"]:
              if "duo" in t["name"].lower(): print(t["bundlePath"]); break')
          echo "bundle: $P"
          find "$P" -maxdepth 4 | head -60
          for f in "$P/Contents/Resources/profile.plist" "$P/Contents/Resources/capabilities.plist" "$P/Contents/Info.plist"; do echo "=== $f"; plutil -p "$f" 2>&1 | head -150; done
      - name: SDK headers
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path); echo "$SDK"
          H="$SDK/System/Library/Frameworks/UIKit.framework/Headers"
          echo "=== files naming ReservedRegion"; grep -rl "ReservedRegion" "$H" | head -20
          for f in $(grep -rl "ReservedRegion" "$H" | head -6); do echo "=== $f"; grep -n -B4 -A14 "ReservedRegion" "$f" | head -220; done
          echo "=== swift overlay"; grep -rn -i "reservedRegion" "$SDK/System/Library/Frameworks/UIKit.framework/Modules" 2>/dev/null | cut -c1-400 | head -40
          echo "=== SwiftUI"; grep -rn "reservedRegion\|ReservedRegion" "$SDK/System/Library/Frameworks/SwiftUI.framework/Modules" 2>/dev/null | cut -c1-500 | head -60
          echo "=== WebKit"; grep -rn -i "reserved\|safeArea\|obscured\|verticalBar" "$SDK/System/Library/Frameworks/WebKit.framework/Headers" | cut -c1-300 | head -60
          echo "=== SafariServices"; grep -rn -i "API_AVAILABLE(ios(27\|ios(26" "$SDK/System/Library/Frameworks/SafariServices.framework/Headers" | cut -c1-300 | head -30
          echo "=== vertical bars"; grep -rn "VerticalBar\|verticalBar" "$H" | cut -c1-300 | head -40
          echo "=== status bar new"; grep -n -B2 -A8 "API_AVAILABLE(ios(27" "$H/UIStatusBarManager.h" "$H/UIWindowScene.h" 2>/dev/null | cut -c1-300 | head -80
      - name: CSS names in the simulator's WebKit
        run: |
          RT=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rts = [r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r.get("platform") == "iOS"]
          rts.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          for r in rts: sys.stderr.write(r["name"] + " " + r["buildversion"] + " " + r["runtimeRoot"] + "\n")
          print(rts[-1]["runtimeRoot"])')
          echo "root: $RT"
          ls -la "$RT/System/Library/PrivateFrameworks/WebCore.framework" 2>&1 | head
          find "$RT/System/Library" -maxdepth 4 -name "dyld_sim_shared_cache*" 2>/dev/null | head -20
          for f in $(find "$RT/System/Library" -maxdepth 4 -name "dyld_sim_shared_cache*" 2>/dev/null) "$RT/System/Library/PrivateFrameworks/WebCore.framework/WebCore"; do
            [ -f "$f" ] || continue
            echo "=== $f ($(stat -f %z "$f") bytes)"
            LC_ALL=C grep -a -o -E "(safe-area|viewport-segment|titlebar-area|keyboard-inset|fullscreen-inset|reserved-region|reserved|status-bar|vertical-bar|camera-region|fold)-[a-z0-9-]{3,40}" "$f" | sort | uniq -c | sort -rn | head -70
          done
